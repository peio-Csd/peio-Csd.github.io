<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alexandre CAUSSADE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Fond des abysses : rayons de lumière près de la surface, neige marine et lueurs en profondeur -->
  <div class="abysses" aria-hidden="true">
    <span class="rayons"></span>
    <span class="neige"></span>
    <span class="neige lointaine"></span>
    <span class="lueurs"></span>
  </div>
  <nav class="langues" aria-label="Langue" data-label="choixLangue">
    <a href="?lang=fr" lang="fr">FR</a>
    <a href="?lang=en" lang="en">EN</a>
  </nav>
  <header id="accueil">
    <img class="fond" alt="">
    <div class="quadrillage" aria-hidden="true"></div>
    <span class="coin hg" aria-hidden="true" data-texte="coinHaut">43°29′N 1°34′O</span>
    <span class="coin bd" aria-hidden="true" data-texte="coinBas">48°07′N 1°41′O</span>
    <span class="horizon" aria-hidden="true"></span>
    <div class="accueil-grille">
      <div class="titre">
        <h1 id="nom"></h1>
        <p id="accroche"></p>
      </div>
      <!-- Tableau de bord : le premier bloc de « Mon profil », animé par main.js -->
      <section class="terminal" aria-label="Mon profil" data-label="profil">
        <div class="barre"><span id="console-titre" data-texte="connexion">Connexion sécurisée · Mon profil</span><span class="voyant" data-texte="enLigne">En ligne</span></div>
        <p id="console-texte" class="lecteur"></p>
        <div id="console" aria-hidden="true"></div>
      </section>
    </div>
    <a class="invite" href="#page" data-texte="amarres">Larguez les amarres ↓</a>
  </header>

  <!-- Rose des vents : tourne selon le cap de l'ancre -->
  <svg id="rose" viewBox="-50 -50 100 100" aria-hidden="true">
    <circle r="46" class="anneau"></circle>
    <circle r="38" class="anneau fin"></circle>
    <g class="aiguille">
      <path d="M0,-44 L7,0 L0,44 L-7,0 Z" class="branche"></path>
      <path d="M-44,0 L0,-5 L44,0 L0,5 Z" class="branche"></path>
      <path d="M0,-44 L7,0 L-7,0 Z" class="nord"></path>
      <text y="-30" text-anchor="middle">N</text>
    </g>
  </svg>

  <!-- Profondeur : réglée par main.js selon le défilement -->
  <p class="profondeur" aria-hidden="true"><span class="valeur"><span id="metres">0</span> m</span><span id="zone"></span></p>
  <button id="surface" class="surface" type="button" data-texte="surface">Remonter à la surface</button>

  <main id="page">
    <div class="carte">
      <svg class="sondes" aria-hidden="true"></svg>
      <div class="parcours" aria-hidden="true">
        <svg><path class="prevue"></path><path class="suivie"></path></svg>
        <svg class="ancre" viewBox="-12 -16 24 28"><circle cy="-12" r="2.5"></circle><path d="M0,-9.5 L0,10 M-5,-6 L5,-6 M-9,1 Q-8,9 0,10 Q8,9 9,1 M-11,4 L-9,1 L-6,3 M11,4 L9,1 L6,3"></path></svg>
      </div>
      <div id="contenu"><!-- rempli par main.js à partir de js/content.js --></div>
    </div>
  </main>

  <footer>
    <p class="fin" data-texte="finJournal">— Fin du journal de bord —</p>
    <a href="#accueil" data-texte="retourPort">Retour au port ↑</a>
    <p>© <span id="annee"></span> Alexandre CAUSSADE</p>
  </footer>

  <script src="js/content.js"></script>
  <script src="js/content.en.js"></script>
  <script src="js/langue.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
